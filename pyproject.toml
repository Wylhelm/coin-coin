[project]
name = "coincoin"
version = "0.1.0"
description = "Coin-Coin voice service: shared interfaces and local service foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "soxr>=1.0.0",
]

[project.scripts]
coincoin = "coincoin.app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --cov=coincoin --cov-report=term-missing --cov-fail-under=80"
markers = ["sim: requires an explicitly assigned simulator and relay"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
]
